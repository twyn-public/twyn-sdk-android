name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Avoid the removed "tools" package (breaks on current runners).
          packages: "platform-tools"

      # GitHub Packages Maven requires a PAT (classic) — GitHub App installation
      # tokens return 401 on maven.pkg.github.com. The token comes from the
      # TWYN_MAVEN_USER / TWYN_MAVEN_TOKEN repo secrets (see the internal
      # twyn-internal/twyn-sdk-dist docs).
      - name: Build sample
        env:
          TWYN_MAVEN_USER: ${{ secrets.TWYN_MAVEN_USER }}
          TWYN_MAVEN_TOKEN: ${{ secrets.TWYN_MAVEN_TOKEN }}
        run: ./gradlew :sample:assembleDebug --no-daemon
